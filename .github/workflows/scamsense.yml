name: ScamSense

on:
  pull_request:
    paths:
      - "scam-sense/**"
      - ".github/workflows/scamsense.yml"
  push:
    branches:
      - main
    paths:
      - "scam-sense/**"
      - ".github/workflows/scamsense.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scam-sense
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scam-sense/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
