name: Finance Flow

on:
  pull_request:
    paths:
      - "finance-flow/**"
      - ".github/workflows/finance-flow.yml"
  push:
    branches:
      - main
    paths:
      - "finance-flow/**"
      - ".github/workflows/finance-flow.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-flow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finance-flow/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: finance-flow-dist
          path: finance-flow/dist
